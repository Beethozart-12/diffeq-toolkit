[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diffeq-toolkit"
version = "0.1.0"
description = "常微分方程（ODE）与偏微分方程（PDE）数值求解工具库"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Beethozart-12" }]
keywords = [
    "differential-equations",
    "ode",
    "pde",
    "numerical-methods",
    "runge-kutta",
    "scientific-computing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.21",
    "matplotlib>=3.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# 网页公式求解界面（web/app.py）所需的依赖。
# 注意：sympy 的 LaTeX 解析依赖 antlr4-python3-runtime，且 sympy 1.12+ 仅接受 4.11.x
# （其版本检查为 startswith('4.11')，生成代码里写死 checkVersion("4.11.1")），
# 故此处显式钉死 4.11.1，否则会报 "requires antlr4 ... version 4.11"。
web = ["sympy>=1.13", "antlr4-python3-runtime==4.11.1"]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
